<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b16">
<title>João Gabriel — 7 anos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070812;color:#fff;font-family:Arial,sans-serif}
.hero{min-height:100vh;display:grid;place-items:center;padding:22px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 15%,#51300b 0,transparent 30%),linear-gradient(180deg,#111426,#070812)}
.card{width:min(720px,100%);padding:30px 20px;border:2px solid #ff9d00;border-radius:26px;text-align:center;background:#0c0d18e8;box-shadow:0 0 45px #ff780033;position:relative;z-index:2}
.badge{display:inline-block;background:#e85d04;padding:8px 14px;border-radius:99px;font-weight:800;font-size:12px;letter-spacing:1px}
h1{font-size:clamp(42px,11vw,76px);margin:16px 0 4px;text-transform:uppercase}.sub{font-size:22px;color:#ffd166;font-weight:700}
.age{font-size:clamp(90px,22vw,140px);line-height:.85;color:#ff7900;font-weight:900;text-shadow:0 5px #762900;margin:12px 0}
.info{font-size:18px;line-height:1.7;margin:18px 0}.info strong{color:#ffd166}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:13px;padding:14px 10px;font-size:15px;font-weight:800;text-decoration:none;color:#fff;cursor:pointer}
.orange{background:#e85d04}.dark{background:#292a3d}.green{background:#168a54}.blue{background:#1468d4}
.note{margin-top:16px;color:#aaa;font-size:12px}.star{position:absolute;font-size:30px;left:-50px;animation:fly 7s linear infinite;opacity:.8}
.a{top:15%}.b{top:42%;animation-delay:2s;animation-duration:8s}.c{top:72%;animation-delay:1s}
@keyframes fly{to{transform:translateX(115vw) rotate(900deg)}}@media(max-width:520px){.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="hero">
<div class="star a">✦</div><div class="star b">✧</div><div class="star c">✦</div>
<section class="card">
<div class="badge">MISSÃO NINJA • CONVITE ESPECIAL</div>
<h1>João Gabriel</h1><div class="sub">está completando</div><div class="age">7</div><div class="sub">anos!</div>
<div class="info">🗓️ <strong>02 de outubro de 2026</strong><br>⏰ <strong>16h</strong><br>📍 <strong>Dom Bosco - Colégio Bilíngue</strong><br>Av. Fernando Vilela, 152 — Martins<br>Uberlândia — MG</div>
<div class="actions">
<a class="btn orange" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Av.%20Fernando%20Vilela%2C%20152%20-%20Martins%2C%20Uberl%C3%A2ndia%20-%20MG%2C%2038400-458">📍 Ver localização</a>
<button class="btn dark" onclick="agenda()">📅 Adicionar à agenda</button>
<a class="btn green" target="_blank" id="wa">📲 Compartilhar no WhatsApp</a>
<button class="btn blue" onclick="music()">🎵 Música</button>
</div>
<div class="note">Prepare sua bandana ninja e venha participar dessa missão! 🥷</div>
</section>
</main>
<audio id="audio" src="musica-ninja.mp3" preload="auto" loop></audio>
<script>
const audio=document.getElementById('audio');
document.getElementById('wa').href='https://wa.me/?text='+encodeURIComponent('🥷 MISSÃO ESPECIAL! João Gabriel está completando 7 anos! 🎂\n\n📅 02/10/2026 às 16h\n📍 Dom Bosco - Colégio Bilíngue, Av. Fernando Vilela, 152 - Martins, Uberlândia/MG\n\nVenha participar dessa missão ninja!');
function agenda(){
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Joao Gabriel//Convite',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:joao-gabriel-7-2026@convite','DTSTAMP:20260924T000000Z',
    'DTSTART:20261002T190000Z','DTEND:20261002T220000Z',
    'SUMMARY:Aniversário do João Gabriel - 7 anos',
    'LOCATION:Dom Bosco - Colégio Bilíngue, Av. Fernando Vilela, 152, Martins, Uberlândia - MG',
    'DESCRIPTION:Missão especial de aniversário do João Gabriel.',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='aniversario-joao-gabriel.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function music(){
  try{
    if(audio.paused){await audio.play(); this.textContent='⏸️ Pausar música';}
    else{audio.pause(); this.textContent='🎵 Música';}
  }catch(e){
    alert('Toque novamente no botão Música para iniciar o áudio.');
  }
}
</script>
</body>
</html>
