<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="description" content="Convite de aniversário do João Gabriel — 7 anos">
<title>João Gabriel — 7 anos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050b14;min-height:100%;font-family:Arial,sans-serif}body{display:flex;justify-content:center;overflow-x:hidden}.wrap{width:min(100%,720px);position:relative;line-height:0}.art{width:100%;height:auto;display:block}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:5;border-radius:20px}.map{left:6%;width:28%;top:72.4%;height:5.2%}.calendar{left:36%;width:28%;top:72.4%;height:5.2%}.share{left:67%;width:28%;top:72.4%;height:5.2%}.music{left:18%;width:64%;top:79%;height:6.5%}.shuriken{position:fixed;z-index:10;pointer-events:none;font-size:26px;filter:drop-shadow(0 0 5px #8fdcff);animation:fly 6s linear infinite;opacity:.9}.s1{top:18%;left:-40px}.s2{top:42%;left:-50px;animation-delay:2s;animation-duration:7s}.s3{top:70%;left:-40px;animation-delay:1s;animation-duration:8s}@keyframes fly{to{transform:translateX(110vw) rotate(900deg)}}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.88);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.3;opacity:0;transition:.25s;z-index:30;text-align:center;max-width:90%}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}audio{display:none}
</style>
</head>
<body>
<div class="wrap">
<img class="art" src="convite-naruto.png" alt="Convite de aniversário do João Gabriel, 7 anos">
<button class="hotspot map" aria-label="Ver localização" onclick="openMap()"></button>
<button class="hotspot calendar" aria-label="Adicionar à agenda" onclick="addCalendar()"></button>
<button class="hotspot share" aria-label="Compartilhar no WhatsApp" onclick="shareInvite()"></button>
<button class="hotspot music" aria-label="Ativar ou pausar música" onclick="toggleMusic()"></button>
</div>
<div class="shuriken s1">✦</div><div class="shuriken s2">✦</div><div class="shuriken s3">✦</div>
<audio id="music" loop preload="none"><source src="" type="audio/mpeg"></audio><div id="toast" class="toast"></div>
<script>
const maps='https://www.google.com/maps/search/?api=1&query=Escola%20Dom%20Bosco%2C%20Av.%20Fernando%20Vilela%2C%20152%2C%20Martins%2C%20Uberl%C3%A2ndia%20-%20MG%2C%2038400-458';
function openMap(){window.open(maps,'_blank','noopener')}
function shareInvite(){const text='🥷 João Gabriel está completando 7 anos! 🎂\n\n📅 02/10/2026 às 16h\n📍 Escola Dom Bosco — Av. Fernando Vilela, 152, Martins, Uberlândia/MG\n\nVenha participar dessa grande missão!';const url=location.href;const wa='https://wa.me/?text='+encodeURIComponent(text+'\n\n'+url);window.open(wa,'_blank','noopener')}
function addCalendar(){const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Joao Gabriel//Convite//PT-BR','BEGIN:VEVENT','UID:joao-gabriel-7-2026@convite','DTSTAMP:20260924T000000Z','DTSTART:20261002T190000Z','DTEND:20261002T210000Z','SUMMARY:Aniversário do João Gabriel - 7 anos','LOCATION:Escola Dom Bosco, Av. Fernando Vilela, 152, Martins, Uberlândia - MG','DESCRIPTION:Venha participar dessa grande missão!','END:VEVENT','END:VCALENDAR'].join('\r\n');const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aniversario-joao-gabriel.ics';a.click();show('Arquivo da agenda preparado!');setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function toggleMusic(){const m=document.getElementById('music');if(!m.src||m.src.endsWith('/')){show('A arte está pronta. Para ativar a música, adicione um arquivo MP3 ao projeto.');return}m.paused?m.play():m.pause()}
function show(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
</script>
</body></html>
