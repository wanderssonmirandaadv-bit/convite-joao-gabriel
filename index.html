<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Missão Ninja — João Gabriel</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:Poppins,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 20%,#b93600 0,transparent 30%),
    linear-gradient(180deg,#050505,#17100d 55%,#050505);
}

/* FUNDO */
#efeitos{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
}

.particula{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff7a00;
  opacity:.65;
  animation:subir linear infinite;
}

@keyframes subir{
  from{transform:translateY(110vh);opacity:0}
  20%{opacity:.7}
  to{transform:translateY(-20vh);opacity:0}
}

/* SHURIKENS */
.shuriken{
  position:absolute;
  font-size:34px;
  animation:voar linear infinite;
  filter:drop-shadow(0 0 7px #ff6a00);
}

@keyframes voar{
  0%{transform:translate(-15vw,-20vh) rotate(0deg)}
  100%{transform:translate(120vw,120vh) rotate(900deg)}
}

/* ABERTURA */
.tela{
  position:relative;
  z-index:3;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
}

.convite{
  position:relative;
  width:100%;
  max-width:470px;
  overflow:hidden;
  border-radius:32px;
  border:2px solid #ff6b00;
  background:rgba(8,8,8,.94);
  box-shadow:
    0 0 50px rgba(255,85,0,.3),
    0 25px 80px rgba(0,0,0,.8);
}

/* LUZ */
.luz{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  background:#ff5b00;
  filter:blur(90px);
  opacity:.18;
  top:-120px;
  left:50%;
  transform:translateX(-50%);
}

.conteudo{
  position:relative;
  z-index:5;
  padding:30px 22px;
  text-align:center;
}

/* NINJA DECORATIVO */
.ninja{
  width:190px;
  height:190px;
  margin:0 auto 10px;
  position:relative;
  animation:flutuar 3s ease-in-out infinite;
}

.cabeca{
  position:absolute;
  width:125px;
  height:125px;
  background:#ef8b45;
  border-radius:50%;
  left:33px;
  top:20px;
  border:5px solid #151515;
}

.cabelo{
  position:absolute;
  width:135px;
  height:70px;
  left:28px;
  top:5px;
  background:#151515;
  border-radius:60% 60% 20% 20%;
}

.faixa{
  position:absolute;
  width:140px;
  height:23px;
  left:25px;
  top:62px;
  background:#171717;
  border:3px solid #333;
  z-index:4;
}

.simbolo{
  position:absolute;
  left:78px;
  top:64px;
  font-size:17px;
  z-index:5;
}

.olho{
  position:absolute;
  width:15px;
  height:8px;
  background:white;
  border-radius:50%;
  top:91px;
  z-index:5;
}

.olho.esq{left:60px}
.olho.dir{left:105px}

.corpo{
  position:absolute;
  width:120px;
  height:70px;
  left:35px;
  top:120px;
  background:#171717;
  border-radius:50px 50px 15px 15px;
  border:4px solid #ef5c00;
}

@keyframes flutuar{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}

/* TEXTOS */
.missao{
  color:#ff9b42;
  font-size:11px;
  font-weight:800;
  letter-spacing:3px;
  margin-bottom:10px;
}

h1{
  font-family:Bangers,cursive;
  color:#ff7410;
  font-size:55px;
  letter-spacing:2px;
  line-height:.95;
  text-shadow:4px 4px #7d2100;
}

.sub{
  margin-top:9px;
  color:#ddd;
  font-size:14px;
}

.idade{
  width:100px;
  height:100px;
  margin:22px auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:linear-gradient(145deg,#ffad19,#e63d00);
  border:5px solid #ffc75a;
  box-shadow:0 0 30px rgba(255,100,0,.4);
}

.idade strong{
  font-family:Bangers;
  font-size:50px;
  line-height:.8;
}

.idade span{
  font-size:11px;
  font-weight:800;
  letter-spacing:2px;
}

.frase{
  font-size:15px;
  line-height:1.7;
  color:#ddd;
  margin-bottom:22px;
}

.destaque{color:#ff8b2b;font-weight:800}

/* INFORMAÇÕES */
.info{
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  padding:13px;
  margin:9px 0;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
}

.icone{
  min-width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e95309;
  border-radius:12px;
  font-size:21px;
}

.info small{
  color:#999;
  display:block;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.info strong{
  display:block;
  font-size:14px;
  margin-top:2px;
}

/* BOTÕES */
.botoes{
  display:grid;
  gap:10px;
  margin-top:18px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  font-family:Poppins;
  font-weight:800;
  font-size:14px;
  color:#fff;
  cursor:pointer;
  transition:.2s;
}

button:active{transform:scale(.97)}

.laranja{
  background:linear-gradient(135deg,#ff8200,#e43d00);
  box-shadow:0 8px 25px rgba(255,70,0,.22);
}

.verde{
  background:#1fc967;
}

.escuro{
  background:#252525;
  border:1px solid #444;
}

/* CONFIRMAÇÃO */
.area{
  margin-top:27px;
  padding-top:24px;
  border-top:1px solid rgba(255,120,0,.25);
}

.area h2{
  font-size:20px;
  margin-bottom:4px;
}

.area p{
  color:#999;
  font-size:11px;
  margin-bottom:14px;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid #444;
  background:#121212;
  color:#fff;
  outline:none;
  font-family:Poppins;
  margin-bottom:10px;
}

input:focus,select:focus{
  border-color:#ff6a00;
}

.erro{
  display:none;
  color:#ff7070;
  font-size:11px;
  text-align:left;
