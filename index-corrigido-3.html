<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>João Gabriel - 7 anos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#080808}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
.pagina{width:100%;max-width:667px;margin:0 auto;padding:0}
.convite{position:relative;width:100%;line-height:0;overflow:hidden;background:#000}
.convite img{display:block;width:100%;height:auto;margin:0;padding:0;border:0}
.area-clicavel{position:absolute;display:block;z-index:5;background:transparent;border:0;padding:0;margin:0;cursor:pointer}
.area-localizacao{left:6.3%;top:74.2%;width:27.5%;height:6.6%}
.area-agenda{left:36.6%;top:74.2%;width:27.0%;height:6.6%}
.area-whatsapp{left:66.0%;top:74.2%;width:28.0%;height:6.6%}
.area-musica{left:18%;top:81.2%;width:64%;height:8.0%}
.area-clicavel:focus{outline:2px solid #fff;outline-offset:2px}
#musica{display:none}
.aviso{display:none}
</style>
</head>
<body>
<div class="pagina">
  <div class="convite">
    <!-- ESTA É A ÚNICA IMAGEM DA PÁGINA -->
    <img src="convite-naruto.png?v=20260924" alt="Convite de aniversário do João Gabriel - 7 anos">

    <!-- Botões invisíveis sobre os botões que já existem na imagem final -->
    <button class="area-clicavel area-localizacao" aria-label="Ver localização" type="button" onclick="abrirLocalizacao()"></button>
    <button class="area-clicavel area-agenda" aria-label="Adicionar à agenda" type="button" onclick="adicionarAgenda()"></button>
    <button class="area-clicavel area-whatsapp" aria-label="Compartilhar no WhatsApp" type="button" onclick="compartilharWhatsApp()"></button>
    <button class="area-clicavel area-musica" aria-label="Reproduzir ou pausar Blue Bird" type="button" onclick="alternarMusica()"></button>

    <audio id="musica" preload="metadata">
      <source src="musica-ninja.mp3?v=20260924" type="audio/mpeg">
    </audio>
  </div>
</div>

<script>
function abrirLocalizacao(){
  const url='https://www.google.com/maps/search/?api=1&query=Av.+Fernando+Vilela,+152,+Martins,+Uberlândia,+MG';
  window.open(url,'_blank','noopener,noreferrer');
}

function compartilharWhatsApp(){
  const texto='🎉 Você está convidado para o aniversário do João Gabriel! 🥷\n\n🎂 7 anos\n📅 02/10/2026 às 16h\n🏫 Dom Bosco - Colégio Bilíngue\n📍 Av. Fernando Vilela, 152 - Martins, Uberlândia - MG';
  window.open('https://wa.me/?text='+encodeURIComponent(texto),'_blank','noopener,noreferrer');
}

function adicionarAgenda(){
  const titulo=encodeURIComponent('Aniversário João Gabriel - 7 anos');
  const local=encodeURIComponent('Dom Bosco - Colégio Bilíngue, Av. Fernando Vilela, 152 - Martins, Uberlândia - MG');
  const detalhes=encodeURIComponent('Aniversário de 7 anos do João Gabriel.');
  const inicio='20261002T160000';
  const fim='20261002T180000';
  const url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+titulo+'&dates='+inicio+'/'+fim+'&location='+local+'&details='+detalhes;
  window.open(url,'_blank','noopener,noreferrer');
}

function alternarMusica(){
  const audio=document.getElementById('musica');
  if(audio.paused){
    audio.play().catch(()=>{});
  }else{
    audio.pause();
  }
}
</script>
</body>
</html>
