<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>João Gabriel - 7 anos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      overflow-x: hidden;
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      position: relative;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .star {
      position: absolute;
      font-size: 22px;
      animation: ninjaStar linear infinite;
      opacity: .9;
    }

    @keyframes ninjaStar {
      from {
        transform: translateX(-100px) rotate(0deg);
      }
      to {
        transform: translateX(110vw) rotate(720deg);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 500px;
      text-align: center;
      border-radius: 24px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 0 35px rgba(255, 80, 0, .45);
    }

    .imagem {
      width: 100%;
      display: block;
      height: auto;
    }

    .conteudo {
      padding: 20px;
      background:
        radial-gradient(circle at top, #3b0d05 0%, #120606 45%, #050505 100%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .idade {
      color: #ff8a00;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .info {
      font-size: 16px;
      line-height: 1.6;
      margin: 8px 0;
    }

    .botoes {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    button,
    .botao {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      color: white;
      background: #e65100;
    }

    .botao-agenda {
      background: #263238;
    }

    .botao-whatsapp {
      background: #25D366;
    }

    .musica {
      margin-top: 18px;
      font-size: 13px;
      opacity: .8;
    }

    audio {
      width: 100%;
      margin-top: 8px;
    }

    .mapa {
      margin-top: 15px;
      display: block;
      color: white;
      text-decoration: none;
      background: #37474f;
      padding: 12px;
      border-radius: 10px;
    }

    .aviso {
      margin-top: 12px;
      font-size: 13px;
      color: #ddd;
    }
  </style>
</head>

<body>

<div class="stars">
  <div class="star" style="top:8%;animation-duration:7s;">✦</div>
  <div class="star" style="top:22%;animation-duration:9s;animation-delay:2s;">✧</div>
  <div class="star" style="top:40%;animation-duration:6s;animation-delay:1s;">✦</div>
  <div class="star" style="top:58%;animation-duration:8s;animation-delay:3s;">✧</div>
  <div class="star" style="top:76%;animation-duration:7s;animation-delay:1s;">✦</div>
  <div class="star" style="top:90%;animation-duration:10s;animation-delay:4s;">✧</div>
</div>

<div class="container">

  <div class="card">

    <!-- IMAGEM OFICIAL DO CONVITE -->
    <img
      src="convite-naruto.png"
      alt="Convite de aniversário do João Gabriel"
      class="imagem"
    >

    <div class="conteudo">

      <h1>João Gabriel</h1>

      <div class="idade">
        🎂 7 ANOS 🎂
      </div>

      <div class="info">
        📅 <strong>02 de outubro de 2026</strong>
      </div>

      <div class="info">
        ⏰ <strong>16h</strong>
      </div>

      <div class="info">
        🏫 <strong>Dom Bosco - Colégio Bilíngue</strong>
      </div>

      <div class="info">
        📍 Av. Fernando Vilela, 152 - Martins<br>
        Uberlândia - MG
      </div>

      <a
        class="mapa"
        href="https://www.google.com/maps/search/?api=1&query=Av.+Fernando+Vilela,+152,+Martins,+Uberlândia,+MG"
        target="_blank">
        📍 Abrir localização
      </a>

      <div class="botoes">

        <button
          class="botao-agenda"
          onclick="adicionarAgenda()">
          🗓️ Adicionar à agenda
        </button>

        <a
          class="botao botao-whatsapp"
          href="https://wa.me/?text=🎉%20Você%20está%20convidado%20para%20o%20aniversário%20do%20João%20Gabriel!%20🎂%0A%0A🥷%207%20anos%0A📅%2002/10/2026%20às%2016h%0A🏫%20Dom%20Bosco%20-%20Colégio%20Bilíngue%0A📍%20Av.%20Fernando%20Vilela,%20152%20-%20Martins,%20Uberlândia%20-%20MG"
          target="_blank">
          💬 Compartilhar no WhatsApp
        </a>

      </div>

      <div class="musica">
        🎵 Blue Bird — Ikimonogakari
      </div>

      <div class="aviso">
        Toque no player abaixo para ouvir a música.
      </div>

      <!--
        IMPORTANTE:
        O navegador bloqueia reprodução automática de música.
        Por isso o visitante precisa tocar no player.
      -->
      <audio controls preload="none">
        <source
          src="https://www.youtube.com/watch?v=6T8Iy2lktgo"
          type="audio/mpeg">
        Seu navegador não suporta áudio.
      </audio>

    </div>
  </div>
</div>

<script>
function adicionarAgenda() {

  const inicio = "20261002T160000";
  const fim = "20261002T180000";

  const titulo = encodeURIComponent(
    "Aniversário João Gabriel - 7 anos"
  );

  const local = encodeURIComponent(
    "Dom Bosco - Colégio Bilíngue, Av. Fernando Vilela, 152 - Martins, Uberlândia - MG"
  );

  const detalhes = encodeURIComponent(
    "Aniversário de 7 anos do João Gabriel."
  );

  const url =
    "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + titulo +
    "&dates=" + inicio + "/" + fim +
    "&location=" + local +
    "&details=" + detalhes;

  window.open(url, "_blank");
}
</script>

</body>
</html>
