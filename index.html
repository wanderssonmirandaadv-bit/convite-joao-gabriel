<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>João Gabriel - 7 anos</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #080808;
  color: white;
  overflow-x: hidden;
}

.estrelas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.estrela {
  position: absolute;
  font-size: 24px;
  animation: movimento linear infinite;
}

.estrela:nth-child(1) {
  top: 10%;
  animation-duration: 7s;
}

.estrela:nth-child(2) {
  top: 30%;
  animation-duration: 9s;
  animation-delay: 2s;
}

.estrela:nth-child(3) {
  top: 50%;
  animation-duration: 6s;
  animation-delay: 1s;
}

.estrela:nth-child(4) {
  top: 70%;
  animation-duration: 8s;
  animation-delay: 3s;
}

.estrela:nth-child(5) {
  top: 85%;
  animation-duration: 10s;
  animation-delay: 1s;
}

@keyframes movimento {
  from {
    left: -50px;
    transform: rotate(0deg);
  }

  to {
    left: 110%;
    transform: rotate(720deg);
  }
}

.pagina {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 10px;
}

.convite {
  background: #100603;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 35px rgba(255, 80, 0, .35);
}

.imagem-convite {
  display: block;
  width: 100%;
  height: auto;
}

.interativo {
  padding: 22px 18px 28px;
  text-align: center;
  background: linear-gradient(#210b04, #080808);
}

.titulo {
  margin: 0;
  font-size: 28px;
}

.idade {
  margin: 6px 0 20px;
  color: #ff9800;
  font-size: 20px;
  font-weight: bold;
}

.info {
  margin: 11px 0;
  line-height: 1.45;
}

.endereco {
  color: #ddd;
  font-size: 14px;
  margin-top: 4px;
}

.botoes {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 22px;
}

.botao {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  color: white;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.agenda {
  background: #37474f;
}

.localizacao {
  background: #e65100;
}

.whatsapp {
  background: #25d366;
}

.musica {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #333;
}

.musica-titulo {
  margin-bottom: 12px;
  font-size: 15px;
}

audio {
  width: 100%;
}

.rodape {
  margin-top: 20px;
  color: #aaa;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="estrelas">
  <div class="estrela">✦</div>
  <div class="estrela">✧</div>
  <div class="estrela">✦</div>
  <div class="estrela">✧</div>
  <div class="estrela">✦</div>
</div>

<main class="pagina">

  <section class="convite">

    <img
      src="./convite-naruto.png"
      alt="Convite de aniversário do João Gabriel"
      class="imagem-convite"
    >

    <div class="interativo">

      <h1 class="titulo">
        João Gabriel
      </h1>

      <div class="idade">
        🥷 7 anos 🎂
      </div>

      <div class="info">
        📅 <strong>02 de outubro de 2026</strong>
      </div>

      <div class="info">
        ⏰ <strong>16h</strong>
      </div>

      <div class="info">
        🏫 <strong>Dom Bosco - Colégio Bilíngue</strong>
      </div>

      <div class="info">
        📍
        <div class="endereco">
          Av. Fernando Vilela, 152 - Martins<br>
          Uberlândia - MG<br>
          CEP 38400-458
        </div>
      </div>

      <div class="botoes">

        <button
          class="botao agenda"
          onclick="adicionarAgenda()">
          🗓️ Adicionar à agenda
        </button>

        <a
          class="botao localizacao"
          href="https://www.google.com/maps/search/?api=1&query=Av.+Fernando+Vilela,+152,+Martins,+Uberlândia,+MG"
          target="_blank">
          📍 Ver localização
        </a>

        <a
          class="botao whatsapp"
          href="https://wa.me/?text=🎉%20Você%20está%20convidado%20para%20o%20aniversário%20do%20João%20Gabriel!%20🥷%0A%0A🎂%207%20anos%0A📅%2002/10/2026%20às%2016h%0A🏫%20Dom%20Bosco%20-%20Colégio%20Bilíngue%0A📍%20Av.%20Fernando%20Vilela,%20152%20-%20Martins,%20Uberlândia%20-%20MG"
          target="_blank">
          💬 Compartilhar no WhatsApp
        </a>

      </div>

      <div class="musica">

        <div class="musica-titulo">
          🎵 <strong>Blue Bird — Ikimono-gakari</strong>
        </div>

        <audio controls preload="metadata">
          <source src="./musica-ninja.mp3" type="audio/mpeg">
          Seu navegador não suporta áudio.
        </audio>

      </div>

      <div class="rodape">
        🥷 Prepare-se para uma aventura ninja! 🥷
      </div>

    </div>

  </section>

</main>

<script>
function adicionarAgenda() {

  const titulo = encodeURIComponent(
    "Aniversário João Gabriel - 7 anos"
  );

  const local = encodeURIComponent(
    "Dom Bosco - Colégio Bilíngue, Av. Fernando Vilela, 152 - Martins, Uberlândia - MG"
  );

  const detalhes = encodeURIComponent(
    "Aniversário de 7 anos do João Gabriel."
  );

  const inicio = "20261002T160000";
  const fim = "20261002T180000";

  const url =
    "https://calendar.google.com/calendar/render" +
    "?action=TEMPLATE" +
    "&text=" + titulo +
    "&dates=" + inicio + "/" + fim +
    "&location=" + local +
    "&details=" + detalhes;

  window.open(url, "_blank");
}
</script>

</body>
</html>
